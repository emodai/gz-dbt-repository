version: 2

sources:
  - name: raw
    description: alias of the "gz_raw_data" dataset in BigQuery which includes all raw data of the greenweez company
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have one row per product_id found in each orders_id
        columns:
          - name: date_date
            description: date of the product sold
          - name: orders_id
            description: Order identifier / primary key
          - name: products_id
            description: Product identifier / join key
          - name: revenue
            description: revenue generated by product
          - name: quantity
            description: quantity of the product sold
        tests:
          - unique_combination_of_columns:
              columns:
                - orders_id
                - pdt_id

      - name: product
        identifier: raw_gz_product
        description: list of the products of greenweez
        columns:
          - name: products_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: price of the product in euro

      - name: ship
        identifier: raw_gz_ship
        description: list of the shipping details by order_id
        columns:
          - name: orders_id
            description: join key
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: fee of shipping for the product
          - name: logcost
            description: cost of the log for the product
          - name: ship_cost
            description: cost of the ship for the product