version: 2

sources:
  - name: raw
    description: alias of the "gz_raw_data" dataset in BigQuery which includes all raw data of the greenweez company
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have one row per product_id found in each orders_id
        columns:
          - name: date_date
            description: date of the product sold
          - name: orders_id
            description: Order identifier / primary key
          - name: products_id
            description: Product identifier / join key
          - name: revenue
            description: revenue generated by product
          - name: quantity
            description: quantity of the product sold
        tests:
          - unique_combination_of_columns:
              columns:
                - orders_id
                - pdt_id

        # Freshness testing - make sure the latest data in sales is more than 90 days old.
        loaded_at_field: CAST(date_date AS TIMESTAMP)
        freshness:
          warn_after: {count: 90, period: day} # ⚠️ warn if older than 90 days

      - name: product
        identifier: raw_gz_product
        description: list of the products of greenweez
        columns:
          - name: products_id
            description: primary key
            tests:
              - unique
              - not_null
          - name: purchase_price
            description: price of the product in euro

      - name: ship
        identifier: raw_gz_ship
        description: list of the shipping details by order_id
        columns:
          - name: orders_id
            description: join key
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: fee of shipping for the product
          - name: logcost
            description: cost of the log for the product
          - name: ship_cost
            description: cost of the ship for the product
      - name: adwords
        identifier: raw_gz_adwords
        description: ads details and cost of Greenweez / campaign_key is not unique
        columns:
          - name: date_date
            description: date of the ad
            tests:
            - not_null
          - name: paid_source
            description: name of the source (e.g. adwords, criteo, bing or facebook)
            tests:
            - not_null
          - name: campaign_key
            description: identifier of the campaign / not unique
            tests:
            - not_null
          - name: camPGN_name
            description: name of the campaign
            tests:
            - not_null
          - name: ads_cost
            description: cost of the ad
            tests:
            - not_null
          - name: impression
            description: nb of views for the add
            tests:
            - not_null
          - name: click
            description: nb of clicks on the add
            tests:
            - not_null
        tests:
          - unique:
              column_name: "(date_date||'-'||campaign_key)"
